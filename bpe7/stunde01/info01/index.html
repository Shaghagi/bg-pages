<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL – Abfragen</title>
<style>
:root{
  --blue:#1976d2;
  --blue-dark:#145ea8;
  --green:#43a047;
  --orange:#f57c00;
  --light-blue:#e3f2fd;
  --light-green:#e8f5e9;
  --light-orange:#fff3e0;
  --ink:#263238;
  --muted:#607d8b;
  --border:#cfd8dc;
  --paper:#ffffff;
  --page:#f5f7f8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:var(--page);
  line-height:1.35;
}
button,input,select{font:inherit}
.page{width:min(1240px,calc(100% - 32px));margin:0 auto 34px}
header{
  height:76px;display:flex;align-items:center;gap:14px;
  border-bottom:1px solid #e4e8eb;margin-bottom:24px;
}
.logo{
  width:48px;height:48px;border-radius:50%;background:#263238;color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:16px;
}
.brand{display:flex;flex-direction:column;gap:0}
.brand strong{font-size:20px;font-weight:700}
.brand span{display:none}
h1{font-size:30px;font-weight:500;margin:0 0 26px;color:#263238}
h2{font-size:20px;margin:0;font-weight:500}
h3{font-size:17px;margin:0}

.tabs{display:flex;gap:0;flex-wrap:wrap;margin-bottom:0;border-bottom:1px solid #b0bec5}
.tab{
  border:0;border-bottom:3px solid transparent;background:transparent;padding:11px 22px 10px;
  cursor:pointer;font-weight:600;color:#546e7a;border-radius:0;transition:.15s;
}
.tab:hover{background:#eceff1;color:#263238}
.tab.active{color:#1565c0;border-bottom-color:#1565c0;background:#fff}

.card{
  background:var(--paper);border:1px solid #d7dde1;border-radius:3px;
  box-shadow:0 1px 3px rgba(0,0,0,.12);overflow:hidden;
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid #e1e6e9;background:#fafafa}
.card-head small{color:#78909c}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:680px;background:#fff}
th,td{padding:9px 13px;text-align:left;border-right:1px solid #e5e9eb;border-bottom:1px solid #e5e9eb;white-space:nowrap}
th:last-child,td:last-child{border-right:0}
th{font-size:14px;color:#37474f;background:#eceff1;font-weight:700}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:#fafafa}
tbody tr:hover td{background:#f1f6f9}
/* Highlighting: nur Rahmen, keine Füllfarben */
.selected-col{
  background:inherit!important;
  border-left:4px solid #1976d2!important;
  border-right:4px solid #1976d2!important;
}
th.selected-col{border-top:4px solid #1976d2!important}
tbody tr:last-child td.selected-col{border-bottom:4px solid #1976d2!important}

/* Treffer einer WHERE-Bedingung werden als ganze Zeile grün umrahmt. */
.matched-row td{
  background:inherit!important;
  border-top:4px solid #2e7d32!important;
  border-bottom:4px solid #2e7d32!important;
}
.matched-row td:first-child{border-left:4px solid #2e7d32!important}
.matched-row td:last-child{border-right:4px solid #2e7d32!important}

/* An Schnittpunkten bleiben beide Hervorhebungen sichtbar. */
.matched-row td.selected-col{
  box-shadow:inset 4px 0 0 #1976d2, inset -4px 0 0 #1976d2;
}
tbody tr:last-child.matched-row td.selected-col{
  box-shadow:inset 4px 0 0 #1976d2, inset -4px 0 0 #1976d2, inset 0 -4px 0 #1976d2;
}

.workspace{margin-top:22px;display:block}
.builder{padding:22px 20px 18px;background:#fff}
.sql-row{
  display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:14px;
}
.keyword{
  min-height:46px;border-radius:4px;display:flex;align-items:center;justify-content:space-between;
  padding:0 10px 0 14px;font-weight:700;letter-spacing:.02em;color:#fff;font-size:18px;
  box-shadow:0 1px 2px rgba(0,0,0,.16);
}
.keyword.select{background:var(--blue)}
.keyword.from{background:var(--green)}
.keyword.where{background:var(--orange)}
.plus{
  width:27px;height:27px;border:1px solid rgba(255,255,255,.75);border-radius:50%;
  background:transparent;color:#fff;font-weight:400;font-size:22px;cursor:pointer;display:grid;place-items:center;line-height:20px;
}
.plus:hover{background:rgba(255,255,255,.18)}
.block-area{display:flex;gap:8px;flex-wrap:wrap;min-height:46px;align-items:center}
.pill{
  display:inline-flex;align-items:center;gap:5px;border:1px solid #b0bec5;background:#fff;
  border-radius:4px;padding:4px 5px 4px 8px;min-height:42px;box-shadow:0 1px 2px rgba(0,0,0,.08);
}
.pill select,.pill input{border:0;outline:0;background:transparent;min-width:120px;color:#263238;padding:4px 3px}
.pill input{min-width:135px;border-left:1px solid #eceff1}
.remove{
  width:24px;height:24px;border:0;border-radius:3px;background:#eceff1;color:#607d8b;cursor:pointer;
  display:grid;place-items:center;font-weight:700
}
.remove:hover{background:#cfd8dc;color:#263238}
.connector{font-size:13px;font-weight:700;color:#455a64;padding:0 2px}
.hint{color:#78909c;font-size:13px}

#selectBlocks .pill{border-left:6px solid var(--blue);background:var(--light-blue)}
#fromBlock .pill{border-left:6px solid var(--green);background:var(--light-green)}
#whereBlocks .pill{border-left:6px solid var(--orange);background:var(--light-orange)}

.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:21px;padding-top:17px;border-top:1px solid #e0e0e0}
.run{
  border:0;background:#1976d2;color:#fff;border-radius:3px;padding:10px 18px;font-weight:600;cursor:pointer;
  box-shadow:0 2px 4px rgba(0,0,0,.18);text-transform:none;
}
.run:hover{background:#1565c0}
.toggle{display:flex;align-items:center;gap:7px;color:#455a64;font-size:14px;cursor:pointer;white-space:nowrap}
.toggle input{width:17px;height:17px;accent-color:#1976d2}
.query-preview{
  flex:1 1 450px;background:#eceff1;color:#263238;border:1px solid #cfd8dc;border-radius:3px;padding:9px 11px;
  font-family:Consolas,"Courier New",monospace;font-size:14px;overflow:auto;white-space:nowrap;
}
.query-preview .s{color:#0d47a1;font-weight:700}.query-preview .f{color:#1b5e20;font-weight:700}.query-preview .w{color:#e65100;font-weight:700}
.notice{display:none;margin:14px 0 0;padding:10px 12px;border-radius:3px;font-size:14px}
.notice.error{display:block;background:#ffebee;color:#b71c1c;border:1px solid #ef9a9a}
.notice.ok{display:block;background:#e8f5e9;color:#1b5e20;border:1px solid #a5d6a7}
.results{margin-top:23px}
.results .card-head{background:#fff;padding:14px 16px}
.empty{padding:32px 20px;text-align:center;color:#78909c}
footer{margin:28px 0 8px;padding-top:18px;border-top:1px solid #e0e0e0;color:#78909c;text-align:left;font-size:12px}
@media(max-width:720px){
  .page{width:min(100% - 18px,1240px)}
  header{height:64px;margin-bottom:18px}.logo{width:42px;height:42px}
  h1{font-size:26px;margin-bottom:18px}
  .sql-row{grid-template-columns:1fr;gap:7px;align-items:start}
  .keyword{max-width:none}.keyword .plus{margin-left:auto}
  .builder{padding:14px 12px}
  .tab{padding:10px 13px}
}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="logo">JvL</div>
    <div class="brand"><strong>Datenbanken</strong><span></span></div>
  </header>

  <h1>SQL-Abfragen</h1>

  <div class="tabs" id="tabs"></div>

  <section class="card" aria-label="Datentabelle">
    <div class="card-head">
      <div><h2 id="tableTitle">Film</h2><small id="tableMeta"></small></div>
    </div>
    <div class="table-wrap"><table id="sourceTable"></table></div>
  </section>

  <section class="workspace">
    <div class="card builder">
      <div class="sql-row">
        <div class="keyword select">SELECT <button class="plus" id="addSelect" title="Weitere Spalte hinzufügen">+</button></div>
        <div class="block-area" id="selectBlocks"></div>
      </div>

      <div class="sql-row">
        <div class="keyword from">FROM</div>
        <div class="block-area" id="fromBlock"></div>
      </div>

      <div class="sql-row">
        <div class="keyword where">WHERE <button class="plus" id="addWhere" title="Weitere Bedingung hinzufügen">+</button></div>
        <div class="block-area" id="whereBlocks"></div>
      </div>

      <div class="notice" id="notice"></div>

      <div class="actions">
        <button class="run" id="runBtn">Abfrage ausführen</button>
        <label class="toggle"><input type="checkbox" id="highlightToggle"> Highlight</label>
        <div class="query-preview" id="preview"></div>
      </div>
    </div>
  </section>

  <section class="card results">
    <div class="card-head"><h2>Ergebnistabelle</h2><small id="resultMeta">Noch keine Abfrage ausgeführt</small></div>
    <div class="table-wrap" id="resultWrap"><div class="empty">Stelle oben eine Abfrage zusammen und klicke auf „Abfrage ausführen“.</div></div>
  </section>

  <footer>Grundlagen der Datenmodellierung<br><span>Die Verwendung geschützter Namen und Marken dient ausschließlich Bildungszwecken.</span></footer>
</div>

<script>
const DB = {
  Film: {
    columns:["Name","Jahr","Preis","Länge","EAN"],
    rows:[
      ["Forrest Gump",1994,7.99,142,"4010884590517"],
      ["König der Löwen",2019,12.99,118,"8717418555689"],
      ["Frozen",2013,6.99,152,"8717418505639"],
      ["Titanic",1997,8.99,195,"4010232057068"],
      ["Dune",2021,14.99,155,"5051890328120"],
      ["König der Löwen",1994,9.99,88,"8717418522742"],
      ["Minions",2015,10.99,91,"5053083026356"],
      ["Avatar",2009,13.99,162,"4013575722600"]
    ]
  },
  Buch: {
    columns:["ISBN","Name","Autor","Jahr","Seiten"],
    rows:[
      ["9783570161319","Die Bestimmung","Veronica Roth",2011,480],
      ["9783548263007","Die Insel","John Connolly",2005,512],
      ["9783938484777","Der Prozess","Franz Kafka",1925,251],
      ["9783499242977","Die Insel","Charlotte Link",2011,80],
      ["9783872915061","Die Verwandlung","Franz Kafka",1915,70],
      ["9783257065541","Der Alchimist","Paulo Coelho",1988,192],
      ["9783453136410","Das Urteil","Franz Kafka",1912,110]
    ]
  },
  Einwohner: {
    columns:["Name","AusweisID","Alter","Augenfarbe","Körpergröße"],
    rows:[
      ["Lukas Schmidt","A30F24N410",16,"Grün",172],
      ["Sarah Müller","U91P77J128",21,"Blau",167],
      ["Jonas Neubauer","T01O31F912",9,"Braun",138],
      ["Anna Becker","K72P14G531",34,"Braun",162],
      ["Tim Schwarz","E44U31H427",28,"Blau",180],
      ["Laura Schmidt","B26E83Z311",25,"Grün",175],
      ["Omar Petrov","R12P19A127",30,"Braun",182],
      ["Clara Weber","K72A66X919",22,"Blau",165],
      ["Felix Klein","T02H14S820",18,"Grün",175]
    ]
  },
  Speise: {
    columns:["Nummer","Name","Preis","Vegan","Kilokalorien"],
    rows:[
      [1,"Lasagne",12.5,false,680],
      [2,"Schokopudding",3.9,false,182],
      [3,"Gemüsepfanne",8.5,true,420],
      [4,"Pizza Margherita",9.2,false,855],
      [5,"Fruchtsalat",4.5,true,158],
      [6,"Quinoa-Salat",8.7,true,510],
      [7,"Hühnchen-Curry",12.5,false,742],
      [8,"Tofu-Stir-Fry",9,true,484]
    ]
  }
};

let activeTable = "Film";
let selectFields = ["Name"];
let whereClauses = [];
let lastMatched = [];

const $ = s => document.querySelector(s);
const esc = v => String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':'&quot;'}[c]));
const display = v => typeof v === "boolean" ? (v ? "TRUE" : "FALSE") : v;

function init(){
  renderTabs();
  renderSource();
  renderFrom();
  renderSelect();
  renderWhere();
  updatePreview();
  $("#addSelect").onclick = () => { selectFields.push(DB[activeTable].columns[0]); renderSelect(); updatePreview(); };
  $("#addWhere").onclick = () => { whereClauses.push({join:"AND",field:DB[activeTable].columns[0],op:"=",value:""}); renderWhere(); updatePreview(); };
  $("#runBtn").onclick = runQuery;
  $("#highlightToggle").onchange = renderSource;
}

function renderTabs(){
  const tabs=$("#tabs"); tabs.innerHTML="";
  Object.keys(DB).forEach(name=>{
    const b=document.createElement("button");
    b.className="tab"+(name===activeTable?" active":"");
    b.textContent=name;
    b.onclick=()=>switchTable(name);
    tabs.appendChild(b);
  });
}

function switchTable(name){
  activeTable=name;
  selectFields=[DB[name].columns[0]];
  whereClauses=[];
  lastMatched=[];
  renderTabs(); renderSource(); renderFrom(); renderSelect(); renderWhere(); updatePreview();
  $("#resultWrap").innerHTML='<div class="empty">Stelle oben eine Abfrage zusammen und klicke auf „Abfrage ausführen“.</div>';
  $("#resultMeta").textContent="Noch keine Abfrage ausgeführt";
  clearNotice();
}

function renderSource(){
  const d=DB[activeTable];
  $("#tableTitle").textContent=activeTable;
  $("#tableMeta").textContent=`${d.rows.length} Datensätze · ${d.columns.length} Attribute`;
  const hi=$("#highlightToggle")?.checked;
  const allSelected=selectFields.includes('*');
  const isSelectedColumn=c=>hi && (allSelected || selectFields.includes(c));
  const useWhereHighlight=hi && whereClauses.length>0;
  let h="<thead><tr>"+d.columns.map(c=>`<th class="${isSelectedColumn(c)?'selected-col':''}">${esc(c)}</th>`).join("")+"</tr></thead><tbody>";
  d.rows.forEach((r,ri)=>{
    const match=useWhereHighlight && lastMatched.includes(ri);
    h+=`<tr class="${match?'matched-row':''}">`+r.map((v,ci)=>`<td class="${isSelectedColumn(d.columns[ci])?'selected-col':''}">${esc(display(v))}</td>`).join("")+"</tr>";
  });
  h+="</tbody>";
  $("#sourceTable").innerHTML=h;
}

function renderFrom(){
  $("#fromBlock").innerHTML=`<div class="pill"><select id="fromSelect">${Object.keys(DB).map(t=>`<option ${t===activeTable?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
  $("#fromSelect").onchange=e=>switchTable(e.target.value);
}

function renderSelect(){
  const root=$("#selectBlocks"); root.innerHTML="";
  selectFields.forEach((field,i)=>{
    const p=document.createElement("div"); p.className="pill";
    p.innerHTML=`<select>${DB[activeTable].columns.map(c=>`<option ${c===field?'selected':''}>${esc(c)}</option>`).join('')}<option ${field==='*'?'selected':''}>*</option></select>${selectFields.length>1?'<button class="remove" title="Entfernen">×</button>':''}`;
    p.querySelector("select").onchange=e=>{selectFields[i]=e.target.value;updatePreview();renderSource();};
    p.querySelector(".remove")?.addEventListener("click",()=>{selectFields.splice(i,1);renderSelect();updatePreview();renderSource();});
    root.appendChild(p);
    if(i<selectFields.length-1){ const comma=document.createElement('span'); comma.className='connector'; comma.textContent=','; root.appendChild(comma); }
  });
}

function renderWhere(){
  const root=$("#whereBlocks"); root.innerHTML="";
  if(!whereClauses.length){root.innerHTML='<span class="hint">Keine Bedingung – alle Datensätze werden berücksichtigt.</span>';return;}
  whereClauses.forEach((cl,i)=>{
    if(i>0){
      const join=document.createElement('select'); join.className='connector';
      join.innerHTML='<option>AND</option><option>OR</option>'; join.value=cl.join;
      join.onchange=e=>{cl.join=e.target.value;updatePreview();}; root.appendChild(join);
    }
    const p=document.createElement("div"); p.className="pill";
    p.innerHTML=`<select class="field">${DB[activeTable].columns.map(c=>`<option ${c===cl.field?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <select class="op"><option>=</option><option>!=</option><option>&lt;</option><option>&lt;=</option><option>&gt;</option><option>&gt;=</option><option>LIKE</option></select>
      <input class="value" value="${esc(cl.value)}" placeholder="Wert">
      <button class="remove" title="Entfernen">×</button>`;
    p.querySelector('.field').onchange=e=>{cl.field=e.target.value;updatePreview();};
    p.querySelector('.op').value=cl.op;
    p.querySelector('.op').onchange=e=>{cl.op=e.target.value;updatePreview();};
    p.querySelector('.value').oninput=e=>{cl.value=e.target.value;updatePreview();};
    p.querySelector('.remove').onclick=()=>{whereClauses.splice(i,1);renderWhere();updatePreview();};
    root.appendChild(p);
  });
}

function quoteValue(v){
  if(v==="") return "''";
  if(/^[-+]?\d+(\.\d+)?$/.test(v)) return v;
  if(/^(true|false)$/i.test(v)) return v.toUpperCase();
  return `'${v.replaceAll("'","''")}'`;
}

function updatePreview(){
  const sel=selectFields.length?selectFields.join(', '):'*';
  let q=`<span class="s">SELECT</span> ${esc(sel)} <span class="f">FROM</span> ${esc(activeTable)}`;
  if(whereClauses.length){
    q+=` <span class="w">WHERE</span> `+whereClauses.map((c,i)=>`${i?esc(c.join)+' ':''}${esc(c.field)} ${esc(c.op)} ${esc(quoteValue(c.value))}`).join(' ');
  }
  $("#preview").innerHTML=q;
}

function normalize(v){
  if(typeof v==='boolean') return v;
  if(typeof v==='number') return v;
  return String(v);
}
function parseUser(v, sample){
  if(typeof sample==='number') return Number(v.replace(',','.'));
  if(typeof sample==='boolean') return /^(true|wahr|1|ja)$/i.test(v);
  return v;
}
function evalClause(row,cl){
  const d=DB[activeTable];
  const idx=d.columns.indexOf(cl.field);
  if(idx<0) return false;
  const a=normalize(row[idx]);
  const b=parseUser(cl.value,a);
  switch(cl.op){
    case '=': return String(a).toLowerCase()===String(b).toLowerCase();
    case '!=': return String(a).toLowerCase()!==String(b).toLowerCase();
    case '<': return a<b;
    case '<=': return a<=b;
    case '>': return a>b;
    case '>=': return a>=b;
    case 'LIKE': {
      const pattern=String(cl.value).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replaceAll('%','.*').replaceAll('_','.');
      return new RegExp('^'+pattern+'$','i').test(String(a));
    }
  }
  return false;
}
function passes(row){
  if(!whereClauses.length) return true;
  let result=evalClause(row,whereClauses[0]);
  for(let i=1;i<whereClauses.length;i++) result=whereClauses[i].join==='AND' ? result && evalClause(row,whereClauses[i]) : result || evalClause(row,whereClauses[i]);
  return result;
}

function runQuery(){
  clearNotice();
  const d=DB[activeTable];
  if(!selectFields.length){showNotice('Bitte mindestens ein Attribut bei SELECT auswählen.','error');return;}
  for(const c of whereClauses){
    if(c.value.trim()===''){showNotice(`Für die Bedingung „${c.field} ${c.op} …“ fehlt ein Vergleichswert.`,'error');return;}
    const sample=d.rows[0][d.columns.indexOf(c.field)];
    if(typeof sample==='number' && ['<','<=','>','>='].includes(c.op) && Number.isNaN(Number(c.value.replace(',','.')))){
      showNotice(`„${c.field}“ enthält Zahlen. Für ${c.op} muss deshalb ein numerischer Vergleichswert eingegeben werden.`,'error');return;
    }
  }
  const cols=selectFields.includes('*')?d.columns:[...new Set(selectFields)];
  const indices=cols.map(c=>d.columns.indexOf(c));
  const matches=[];
  const rows=[];
  d.rows.forEach((r,ri)=>{if(passes(r)){matches.push(ri);rows.push(indices.map(i=>r[i]));}});
  lastMatched=matches;
  renderResult(cols,rows);
  renderSource();
  showNotice(`Abfrage erfolgreich: ${rows.length} Datensatz${rows.length===1?'':'e'} gefunden.`,'ok');
}

function renderResult(cols,rows){
  $("#resultMeta").textContent=`${rows.length} Treffer`;
  if(!rows.length){$("#resultWrap").innerHTML='<div class="empty">Die Abfrage liefert keine Datensätze.</div>';return;}
  let h='<table><thead><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr></thead><tbody>';
  h+=rows.map(r=>'<tr>'+r.map(v=>`<td>${esc(display(v))}</td>`).join('')+'</tr>').join('');
  h+='</tbody></table>';
  $("#resultWrap").innerHTML=h;
}
function showNotice(msg,type){const n=$("#notice");n.className='notice '+type;n.textContent=msg;}
function clearNotice(){const n=$("#notice");n.className='notice';n.textContent='';}

init();
</script>
</body>
</html>
